<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Manager — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="mode-banner" id="modeBanner" data-mode="">checking mode…</div>

  <main class="login">
    <div class="login-card">
      <div class="login-brand">
        <span class="logotype">Money Manager</span>
      </div>

      <div class="login-head">
        <h2 id="formTitle">Sign in</h2>
        <p class="sub" id="formSub">Welcome back. Pick up where you left off.</p>
      </div>

      <div class="notice error hidden" id="notice"></div>

      <form id="authForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn-primary" type="submit" id="submitBtn">Sign in</button>
        </form>

        <div id="oauthBlock">
          <div class="divider"><span>or</span></div>
          <button type="button" class="btn-google" id="googleBtn">
            <svg class="g-icon" width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.346l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            <span id="googleBtnText">Sign in with Google</span>
          </button>
        </div>

        <p class="switch-line" id="switchLine">
          New here? <button type="button" id="loginRegisterSwitch">Create an account</button>
        </p>
    </div>

    <div class="login-credit">
      <span class="credit-name">Jason Lai Kwang Xi</span>
      <span class="credit-id">TP080522</span>
    </div>
  </main>

  <!-- security mode toggle: left = insecure, right = secure -->
  <div class="mode-switch" id="modeSwitch" data-mode="insecure">
    <button class="mode-switch__track" id="modeSwitchBtn" type="button"
            role="switch" aria-checked="false" aria-label="Security mode"
            title="Switch security mode — reloads this mode's demo data and signs you out">
      <span class="mode-switch__knob">
        <svg class="lock lock-unlocked" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="1.6"/>
          <path d="M8 11V8a4 4 0 0 1 7.4-2.1"/>
        </svg>
        <svg class="lock lock-locked" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="1.6"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
      </span>
    </button>
    <span class="mode-switch__label" id="modeSwitchLabel">Insecure</span>
  </div>

  <script src="/static/app.js"></script>
  <script>
    Auth.init();
  </script>
</body>
</html>
